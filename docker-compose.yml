services:
  bot:
    build: .
    container_name: rates-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
      HISTORY_DB_PATH: /data/history.db
    volumes:
      - ./data:/data

  web:
    build: .
    container_name: rates-web
    restart: unless-stopped
    command: python -m app.web
    environment:
      WEB_PORT: "8000"
      HISTORY_DB_PATH: /data/history.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
